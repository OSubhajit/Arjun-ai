<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 100" fill="none">
  <!-- Crown / helmet -->
  <path d="M34 4 L37 1 L40 4.5 L43 1 L46 4" stroke="#d4a855" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Head -->
  <circle cx="40" cy="13" r="7.5" fill="#d4a855"/>
  <!-- Neck -->
  <line x1="40" y1="20.5" x2="40" y2="25" stroke="#d4a855" stroke-width="3" stroke-linecap="round"/>
  <!-- Torso -->
  <path d="M40 25 L40 52" stroke="#d4a855" stroke-width="4" stroke-linecap="round"/>
  <!-- Chest armour suggestion -->
  <path d="M32 28 L40 25 L48 28 L48 38 L40 41 L32 38 Z" fill="#d4a855" opacity="0.25" stroke="#d4a855" stroke-width="1.2"/>
  <!-- Left arm — extended forward holding bow -->
  <path d="M40 29 L20 38" stroke="#d4a855" stroke-width="3" stroke-linecap="round"/>
  <!-- Left hand -->
  <circle cx="20" cy="38" r="2.2" fill="#d4a855"/>
  <!-- Right arm — pulled back drawing string -->
  <path d="M40 29 L58 35" stroke="#d4a855" stroke-width="3" stroke-linecap="round"/>
  <!-- Right hand -->
  <circle cx="58" cy="35" r="2.2" fill="#d4a855"/>
  <!-- BOW (dhanush) — graceful curve -->
  <path d="M20 22 C10 30 10 46 20 54" stroke="#d4a855" stroke-width="2.8" stroke-linecap="round" fill="none"/>
  <!-- Bow tips -->
  <circle cx="20" cy="22" r="1.5" fill="#d4a855"/>
  <circle cx="20" cy="54" r="1.5" fill="#d4a855"/>
  <!-- Bow string -->
  <line x1="20" y1="22" x2="58" y2="35" stroke="#d4a855" stroke-width="1" opacity="0.7"/>
  <line x1="20" y1="54" x2="58" y2="35" stroke="#d4a855" stroke-width="1" opacity="0.7"/>
  <!-- Arrow shaft -->
  <line x1="18" y1="38" x2="56" y2="35" stroke="#e8c070" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Arrow head -->
  <polygon points="60,34.5 54,32 54,37" fill="#e8c070"/>
  <!-- Arrow fletching -->
  <path d="M18 38 L14 35 M18 38 L14 41" stroke="#e8c070" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Hip / stance line -->
  <path d="M34 52 L40 52 L46 52" stroke="#d4a855" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left leg — warrior stance, slightly forward -->
  <path d="M36 52 L30 70 L28 82" stroke="#d4a855" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right leg — back leg -->
  <path d="M44 52 L50 70 L52 82" stroke="#d4a855" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left foot -->
  <path d="M28 82 L22 84 L22 86" stroke="#d4a855" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Right foot -->
  <path d="M52 82 L58 84 L58 86" stroke="#d4a855" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Dhoti / lower garment hint -->
  <path d="M32 52 Q40 58 48 52" stroke="#d4a855" stroke-width="1.5" opacity="0.4" fill="none"/>
  <!-- Subtle glow ring behind figure -->
  <circle cx="40" cy="45" r="36" stroke="#d4a855" stroke-width="0.6" opacity="0.12" fill="none"/>
</svg>
